name: Publicar portal no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Sincronizar vídeos da igreja"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  # Prioriza a versão mais nova e evita uma fila de publicações antigas.
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir JavaScript e importação do YouTube
        run: |
          node --check assets/app.js
          node --check assets/videos.js
          python3 -m py_compile tools/sync_youtube.py
      - name: Preparar somente arquivos públicos
        run: |
          mkdir -p dist
          cp ./*.html ./config.js ./sitemap.xml ./robots.txt ./manifest.webmanifest dist/
          cp -R assets dist/assets
          touch dist/.nojekyll
          find . -maxdepth 1 -type f -name 'google*.html' -exec cp {} dist/ \;
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'
      - id: deployment
        uses: actions/deploy-pages@v4