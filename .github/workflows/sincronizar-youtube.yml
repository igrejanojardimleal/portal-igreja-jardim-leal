name: Sincronizar vídeos da igreja
on:
  schedule:
    - cron: '27 */6 * * *'
    - cron: '12 8 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sync_youtube.py'
      - '.github/workflows/sincronizar-youtube.yml'
permissions:
  contents: write
jobs:
  atualizar-galeria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar importação gratuita de vídeos antigos
        run: python3 -m pip install --disable-pip-version-check --quiet yt-dlp || true
      - name: Buscar os vídeos recentes e atualizar catálogo
        env:
          YOUTUBE_HANDLE: igrejanojardimlealobradare8130
          YOUTUBE_CHANNEL_ID: UCvLSuAW-QkwyTYiU7ilvoRw
          YOUTUBE_BACKFILL: '1' # Primeira importação histórica, depois volta à atualização semanal
        run: python3 tools/sync_youtube.py
      - name: Salvar mudanças no repositório
        run: |
          if ! git diff --quiet -- assets/videos.json assets/videos.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/videos.json assets/videos.js
            git commit -m 'Atualiza vídeos do canal da igreja'
            for tentativa in 1 2 3; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 4
            done
            exit 1
          fi