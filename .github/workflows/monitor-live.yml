name: Verificar transmissão ao vivo da igreja
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/check_youtube_live.py'
      - '.github/workflows/monitor-live.yml'
permissions:
  contents: write
concurrency:
  group: monitor-live-igjal
  cancel-in-progress: false
jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar verificador gratuito
        run: python3 -m pip install --disable-pip-version-check --quiet --upgrade yt-dlp
      - name: Verificar status da transmissão
        env:
          YOUTUBE_CHANNEL_ID: UCvLSuAW-QkwyTYiU7ilvoRw
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/check_youtube_live.py
      - name: Salvar quando mudar
        run: |
          if ! git diff --quiet -- assets/live.json assets/videos.json assets/videos.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/live.json assets/videos.json assets/videos.js
            git commit -m 'Atualiza destaque de live da igreja'
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 4
            done
            exit 1
          fi
